name: Build XunCloud Android Only
run-name: XunCloud Android · ${{ github.ref_name }}

on:
  # Also gives changes to this entry their own validation, without rerunning
  # the three relatively expensive native desktop builds.
  push:
    branches: [main]
    paths: ['.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xuncloud-android-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    uses: xunzhimeng/syncthing-android/.github/workflows/build-app.yaml@main
    with:
      coreRef: ${{ github.sha }}
