name: Build XunCloud Clients
run-name: XunCloud clients · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clients.yml'
      - 'desktop/**'
      - 'cmd/syncthing/**'
      - 'lib/**'
      - 'internal/**'
      - 'gui/**'
      - 'go.mod'
      - 'go.sum'
      - 'script/ci_desktop.py'
  workflow_dispatch:
    inputs:
      server:
        description: 'Enrollment HTTPS host:port (not the management GUI)'
        type: string
        default: '192.168.0.104:18443'
      build_android:
        description: 'Also build the Android APK'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: xuncloud-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: XunCloud-macos-arm64
            bundle: app
          - name: macOS Intel
            runner: macos-15-intel
            artifact: XunCloud-macos-x64
            bundle: app
          - name: Windows x64
            runner: windows-2025
            artifact: XunCloud-windows-x64
            bundle: nsis
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/ci-target
      ENROLLMENT_SERVER: ${{ inputs.server || '192.168.0.104:18443' }}
      CGO_ENABLED: '0'
    steps:
      - name: Preserve source and certificate LF bytes on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp/ci-target
          key: xuncloud-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: xuncloud-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and test account-aware core
        run: |
          set -euo pipefail
          go generate ./lib/api/auto
          go test ./lib/cloudsync ./lib/api ./cmd/syncthing
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          go build -trimpath -tags noupgrade -ldflags '-s -w -X github.com/syncthing/syncthing/lib/build.Version=v2.1.7-xuncloud-ci' \
            -o "desktop/src-tauri/resources/syncthing${suffix}" ./cmd/syncthing
          "desktop/src-tauri/resources/syncthing${suffix}" --version
      - name: Prepare public server resources
        run: python script/ci_desktop.py prepare --server "$ENROLLMENT_SERVER"
      - name: Check desktop behavior and Rust
        run: |
          set -euo pipefail
          npm ci --prefix desktop
          npm run test:web --prefix desktop
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build native desktop installer
        working-directory: desktop
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: npm run tauri -- build --bundles "$BUNDLE"
      - name: Package download and checksums
        run: python script/ci_desktop.py package --target-dir "$CARGO_TARGET_DIR" --output tmp/ci-artifacts
      - name: Upload downloadable app
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: tmp/ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: Android APK
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    uses: xunzhimeng/syncthing-android/.github/workflows/build-app.yaml@main
    with:
      coreRef: ${{ github.sha }}
